name: Hexo CI Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.19.1

      - name: Install dependencies
        run: npm ci

      # =========================
      # 🔥 关键：临时替换 root
      # =========================
      - name: Patch root for GitHub Pages
        run: |
          sed -i 's|root: /|root: /emtime-blog/|' _config.yml

      - name: Build Hexo
        run: |
          npx hexo clean
          npx hexo generate

      # =========================
      # ① 上传 public（你要下载的）
      # =========================
      - name: Upload public artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexo-public
          path: public

      # =========================
      # ② 上传 Pages 专用产物
      # =========================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
