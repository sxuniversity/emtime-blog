name: Hexo CI Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.19.1

      - name: Install dependencies
        run: npm ci

      - name: Build Hexo
        run: |
          npx hexo clean
          npx hexo generate

      # =========================
      # ① 上传 public（你要下载的）
      # =========================
      - name: Upload public artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexo-public
          path: public

      # =========================
      # ② 上传 Pages 专用产物
      # =========================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  deploy-server:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hexo-public
          path: public

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          cat << 'EOF' > ~/.ssh/id_ed25519
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF

          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Debug SSH connection
        run: ssh -vvv -i ~/.ssh/id_ed25519 ${{ secrets.USER }}@${{ secrets.HOST }} "echo OK"

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.USER }}@${{ secrets.HOST }} "
            rm -rf /www/wwwroot/xt.orangetime.top/* || true
          "

          rsync -avz -e "ssh -i ~/.ssh/id_ed25519" public/ \
          ${{ secrets.USER }}@${{ secrets.HOST }}:/www/wwwroot/xt.orangetime.top/
